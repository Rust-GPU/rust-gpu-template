[workspace]
members = [
    "mygraphics",
    "mygraphics-shaders"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["generated <generated>"]
edition = "2024"
license = "MIT"
repository = ""

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }



[workspace.dependencies]
# API
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "vulkan-portability", "spirv", "wgsl"] }
pollster = "1.0.1"

# rust-gpu
# While `cargo-gpu` is backwards compatible with older rust-gpu versions, easiest is to just match the versions exactly.
cargo-gpu-install = { version = "0.10.0", git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "42d2720c67c3c643bf90a6faa8380bd6c6b5fb33" }
spirv-std = { version = "0.10.0", git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "42d2720c67c3c643bf90a6faa8380bd6c6b5fb33" }

# math libraries
glam = { version = "0.33.11", default-features = false, features = ["bytemuck"] }
bytemuck = { version = "1.24.0", features = ["derive"] }

# other
raw-window-handle = "0.6.2"
winit = "0.30.0"
env_logger = "0.11.8"
anyhow = "1.0.98"

