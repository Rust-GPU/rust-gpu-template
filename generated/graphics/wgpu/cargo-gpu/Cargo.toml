[workspace]
members = [
    "mygraphics",
    "mygraphics-shaders"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["generated <generated>"]
edition = "2024"
license = "MIT"
repository = ""

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
# API
wgpu = { version = "29.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "vulkan-portability", "spirv", "wgsl"] }
pollster = "0.4.0"

# rust-gpu
# While `cargo-gpu` is backwards compatible with older rust-gpu versions, easiest is to just match the versions exactly.
cargo-gpu-install = { git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "e4940edef5ccfb1b51b1689ea1b83417fc8cd536" }
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "e4940edef5ccfb1b51b1689ea1b83417fc8cd536" }

# other
glam = { version = "0.33.11", default-features = false }
bytemuck = { version = "1.24.0", features = ["derive"] }
raw-window-handle = "0.6.2"
winit = "0.30.0"
env_logger = "0.11.8"
anyhow = "1.0.98"

